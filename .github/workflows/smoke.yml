name: Synthetic smoke checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Never deploy, access production, schedule cron, or pass provider credentials here.
# Tests use fake responses, disposable local files and an isolated MariaDB service.
permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Release candidate integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The RCs reference old, pinned Git objects; the default shallow clone is insufficient.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Rebuild content and check preservation on synthetic overlays
        run: |
          python3 tests/build_update_candidate_smoke.py
          python3 tests/build_rc2_directadmin_filecheck_smoke.py
          python3 tests/upgrade_candidate_overlay_smoke.py --candidate rc1
          python3 tests/upgrade_candidate_overlay_smoke.py --candidate rc2
          python3 tests/build_worker_cache_update_smoke.py
          node tests/worker_filecheck_smoke.mjs
          (cd release-files/after-v2026.11.07.5-rc1 && sha256sum -c SHA256SUMS.txt)
          (cd release-files/after-v2026.11.07.5-rc2 && sha256sum -c SHA256SUMS.txt)
          (cd release-files/rc2-directadmin-filecheck && sha256sum -c SHA256SUMS.txt)
          (cd release-files/after-rc2-worker-cache && sha256sum -c SHA256SUMS.txt)
          python3 tests/media_tab_500_hotfix_smoke.py
          (cd release-files/media-tab-500-hotfix && sha256sum -c SHA256SUMS.txt)
          python3 tests/media_library_opcache_fix_smoke.py
          (cd release-files/media-library-opcache-fix && sha256sum -c SHA256SUMS.txt)
          python3 tests/ad_slots_header_footer_update_smoke.py
          (cd release-files/ad-slots-and-header-footer-update && sha256sum -c SHA256SUMS.txt)
          python3 tests/unified_categories_dedupe_update_smoke.py
          (cd release-files/unified-categories-and-dedupe && sha256sum -c SHA256SUMS.txt)
          python3 tests/staff_mail_persian_ui_update_smoke.py
          (cd release-files/staff-mail-persian-ui && sha256sum -c SHA256SUMS.txt)

  frontend:
    name: Admin build and synthetic UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and verify committed admin assets
        run: |
          npm run lint
          npm run build
          for file in admin.js admin.css; do
            cmp "dist/assets/$file" "public_html/admin/assets/$file"
            hash=$(sha256sum "public_html/admin/assets/$file" | cut -c1-12)
            grep -Fq "/admin/assets/$file?v=$hash" public_html/admin/index.html
          done
      - name: UI, CSV and banner smoke tests (synthetic data)
        run: |
          for test in \
            tests/persian_date_input_smoke.tsx \
            tests/admin_mail_ui_smoke.tsx \
            tests/staff_ui_smoke.tsx \
            tests/advertising_reporting_ui_smoke.tsx \
            tests/advertising_finance_ui_smoke.tsx \
            tests/advertising_finance_logout_ui_smoke.tsx \
            tests/advertising_payment_sandbox_ui_smoke.tsx \
            tests/csv_import_smoke.ts \
            tests/csv_import_ui_smoke.tsx \
            tests/apify_panel_smoke.tsx \
            tests/article_sponsor_ui_smoke.tsx \
            tests/article_editor_ui_smoke.tsx \
            tests/ai_article_ui_smoke.tsx \
            tests/ai_provider_ui_smoke.tsx \
            tests/business_delete_and_media_ui_smoke.tsx \
            tests/unified_categories_and_dedupe_ui_smoke.tsx; do
            ./node_modules/.bin/tsx "$test"
          done
          node tests/advertising_banner_client_smoke.mjs

  php:
    name: PHP ${{ matrix.php }} offline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, fileinfo, gd, pdo, pdo_mysql
          coverage: none
      - name: Syntax of tracked PHP files
        run: |
          php --version
          git ls-files -z -- '*.php' | xargs -0 -n1 php -l > /dev/null
          echo 'PASS: tracked PHP syntax'
      - name: Unit and security smoke tests (fake data and no network)
        run: |
          for test in \
            tests/ai_advertising_unit_smoke.php \
            tests/ai_provider_settings_smoke.php \
            tests/ai_provider_vault_smoke.php \
            tests/admin_mail_smoke.php \
            tests/staff_access_smoke.php \
            tests/payment_sandbox_flag_smoke.php \
            tests/payment_gateway_protocol_smoke.php \
            tests/cache_generation_concurrency_smoke.php \
            tests/sponsorship_cache_version_smoke.php \
            tests/sponsorship_dashboard_status_smoke.php \
            tests/sponsorship_time_boundary_smoke.php \
            tests/article_text_security_smoke.php; do
            php "$test"
          done
          python3 tests/payment_protocol_isolation_smoke.py
          HHX_ALLOW_TEST_FIXTURES=1 php tests/media_service_synthetic_smoke.php
      - name: RC2 read-only preflight against a synthetic baseline
        run: |
          python3 tests/rc2_read_only_preflight_smoke.py
          python3 tests/rc2_directadmin_once_smoke.py

  database-concurrency:
    name: MariaDB 10.11 synthetic concurrency and pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: fixture-root-password-only
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: hhx_test_worker_ci
        ports:
          - 33306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, curl, fileinfo, gd, pdo, pdo_mysql
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Fake worker contention, failures and cache invalidation
        env:
          HHX_ALLOW_TEST_FIXTURES: '1'
        run: |
          cat > "$RUNNER_TEMP/worker-config.php" <<'PHP'
          <?php return [
              'app'=>['timezone'=>'Asia/Tehran'],
              'db'=>['host'=>'127.0.0.1','port'=>33306,'database'=>'hhx_test_worker_ci',
                     'username'=>'root','password'=>'fixture-root-password-only','charset'=>'utf8mb4'],
              'providers'=>[], 'security'=>['cookie_secure'=>false],
              'reserved_slugs'=>['admin','api','assets','uploads','cache','city','b','sitemap','robots']
          ];
          PHP
          export HHX_TEST_CONFIG="$RUNNER_TEMP/worker-config.php"
          php tests/worker_cache_database_smoke.php
      - name: Synthetic article cache boundaries without scheduled maintenance
        env:
          HHX_ALLOW_TEST_FIXTURES: '1'
          HHX_TEST_NONCE: synthetic-fixture-nonce-only
          HHX_TEST_PASSWORD: synthetic-password-only
          HHX_TEST_URL: http://127.0.0.1:18795
          HHX_AI_VAULT_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
        run: |
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=33306", "root", "fixture-root-password-only", [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); $p->exec("CREATE DATABASE hhx_test_public_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          cat > "$RUNNER_TEMP/public-config.php" <<'PHP'
          <?php return [
              'app'=>['timezone'=>'Asia/Tehran', 'url'=>'http://127.0.0.1:18795'],
              'db'=>['host'=>'127.0.0.1','port'=>33306,'database'=>'hhx_test_public_ci',
                     'username'=>'root','password'=>'fixture-root-password-only','charset'=>'utf8mb4'],
              'providers'=>[], 'security'=>['cookie_secure'=>false,'session_name'=>'hhx_fixture_session'],
              'reserved_slugs'=>['admin','api','assets','uploads','cache','city','b','sitemap','robots','install','check','storage']
          ];
          PHP
          export HHX_TEST_CONFIG="$RUNNER_TEMP/public-config.php"
          root="$RUNNER_TEMP/hhx-page-fixture"
          mkdir -p "$root"
          cp -a app config cron database public_html tests collector-remote "$root/"
          php "$root/tests/setup_article_url_fixture.php"
          php "$root/tests/manual_import_smoke.php"
          php "$root/tests/collector_smoke.php"
          php "$root/tests/unified_categories_and_dedupe_db_smoke.php"
          php -S 127.0.0.1:18795 -t "$root/public_html" "$root/tests/article_fixture_router.php" > "$RUNNER_TEMP/fixture-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS "$HHX_TEST_URL/__article_fixture_guard__" > /dev/null
          node "$root/tests/article_city_http_smoke.mjs"
          node "$root/tests/sponsorship_cache_smoke.mjs"
          php "$root/tests/article_item_display_db_smoke.php"
          node "$root/tests/article_rich_http_smoke.mjs"
          node "$root/tests/media_and_business_delete_http_smoke.mjs"
          node "$root/tests/ai_ads_quality_http_smoke.mjs"
          node "$root/tests/admin_mail_http_smoke.mjs"
          node "$root/tests/staff_http_smoke.mjs"
          node "$root/tests/unified_categories_dedupe_http_smoke.mjs"
          php "$root/tests/apify_direct_smoke.php"
